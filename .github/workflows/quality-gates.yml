name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependencies: production
          - dependencies: legacy
            sqlmodel: "0.0.39"
            sqlalchemy: "2.0.52"
            pydantic: "2.13.4"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jaa_datetime_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jaa_datetime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          group = "${{ matrix.dependencies }}"
          source = Path("backend/requirements.txt")
          text = source.read_text(encoding="utf-8")
          names = {"sqlmodel", "sqlalchemy", "pydantic"}
          expected = {}
          for line in text.splitlines():
              match = re.fullmatch(r"([A-Za-z0-9_-]+)==([^\s]+)", line)
              if match and match[1].lower() in names:
                  expected[match[1].lower()] = match[2]
          assert set(expected) == names, "Core versions must be exact requirements"
          assert sys.version_info[:2] == (3, 13), "Acceptance requires Python 3.13"
          allowed = {"PATH", "HOME", "SYSTEMROOT", "WINDIR", "TEMP", "TMP", "COMSPEC", "PATHEXT", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "LANG", "LC_ALL", "LD_LIBRARY_PATH"}
          clean = {k: v for k, v in os.environ.items() if k.upper() in allowed}
          clean.update(PIP_CONFIG_FILE=os.devnull, PIP_DISABLE_PIP_VERSION_CHECK="1")

          def run(command):
              result = subprocess.run(command, env=clean, capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit("Dependency command failed; raw output withheld")
              return result.stdout

          venv = Path(".ci-backend-venv")
          run([sys.executable, "-m", "venv", str(venv)])
          python = str(venv / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python"))
          version = run([python, "-c", "import platform; print(platform.python_version())"]).strip()
          assert re.fullmatch(r"3\.13\.\d+", version)
          Path("backend-python-version.txt").write_text("Python " + version + "\n", encoding="utf-8")
          print("Python " + version)

          def evidence(label):
              run([python, "-m", "pip", "check"])
              actual = json.loads(run([python, "-c", "import importlib.metadata as m, json; print(json.dumps({n: m.version(n) for n in ['sqlmodel', 'sqlalchemy', 'pydantic']}))"]))
              assert actual == expected, "Installed core versions differ from requirements"
              frozen = run([python, "-m", "pip", "freeze", "--all"])
              if any(line and not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*==[A-Za-z0-9][A-Za-z0-9.!+_-]*", line) for line in frozen.splitlines()):
                  raise SystemExit("Freeze contains non-version entries; evidence withheld")
              Path("backend-" + label + "-pip-freeze.txt").write_text(frozen, encoding="utf-8")
              for name, value in sorted(actual.items()):
                  print(name + "==" + value)

          with tempfile.TemporaryDirectory() as scratch:
              manifest = source
              if group == "legacy":
                  legacy = {"sqlmodel": "${{ matrix.sqlmodel }}", "sqlalchemy": "${{ matrix.sqlalchemy }}", "pydantic": "${{ matrix.pydantic }}"}
                  for name in names:
                      assert re.fullmatch(r"\d+\.\d+\.\d+", legacy[name])
                      text, count = re.subn(r"(?im)^" + name + r"==[^\r\n]+$", name + "==" + legacy[name], text)
                      assert count == 1, "Legacy override must replace exactly one core pin"
                  expected = legacy
                  manifest = Path(scratch) / "legacy-requirements.txt"
                  manifest.write_text(text, encoding="utf-8")
              run([python, "-m", "pip", "install", "-r", str(manifest)])
              evidence("runtime")
              run([python, "-m", "pip", "install", "-r", str(manifest), "pytest"])
              evidence("test")
          PY
      - name: Compile backend
        run: .ci-backend-venv/bin/python -m compileall -q backend/app backend/tests
      - name: Run full backend and fixed-fixture suite
        run: .ci-backend-venv/bin/python backend/tests/run_offline.py -q --tb=short 2>&1 | tee backend-test-results.txt
      - name: Run isolated PostgreSQL 16 incident acceptance
        run: |
          for zone in UTC Australia/Perth; do
            .ci-backend-venv/bin/python backend/tests/run_pg16.py --incident-pg16-port 55439 --incident-timezone "$zone" backend/tests/test_datetime_incident.py backend/tests/test_datetime_pg16.py backend/tests/test_pack_credits.py::PostgreSQLPackCreditContractTests -q --tb=short 2>&1 | tee -a backend-pg16-results.txt
          done
      - name: Save backend test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ matrix.dependencies }}-${{ github.run_id }}
          path: |
            backend-test-results.txt
            backend-pg16-results.txt
            backend-python-version.txt
            backend-runtime-pip-freeze.txt
            backend-test-pip-freeze.txt
          retention-days: 30

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend workflow tests
        run: pnpm test
      - name: Install pinned Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run two offline save interface tests
        run: pnpm test:ui
      - name: Build production frontend
        run: pnpm build 2>&1 | tee frontend-build-results.txt
      - name: Save frontend build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-results-${{ github.run_id }}
          path: frontend/frontend-build-results.txt
          retention-days: 30
