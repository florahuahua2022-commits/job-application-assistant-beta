name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependencies: production
            sqlmodel: "0.0.48"
            sqlalchemy: "2.1.6"
            pydantic: "2.14.1"
          - dependencies: legacy
            sqlmodel: "0.0.39"
            sqlalchemy: "2.0.52"
            pydantic: "2.13.4"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jaa_datetime_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jaa_datetime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///./ci-test.db
      DEPLOYMENT_MODE: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python -m pip install -r backend/requirements.txt pytest
          "sqlmodel==${{ matrix.sqlmodel }}"
          "SQLAlchemy==${{ matrix.sqlalchemy }}"
          "pydantic==${{ matrix.pydantic }}"
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run full backend and fixed-fixture suite
        run: python backend/tests/run_offline.py -q --tb=short 2>&1 | tee backend-test-results.txt
      - name: Run isolated PostgreSQL 16 incident acceptance
        run: |
          for zone in UTC Australia/Perth; do
            python backend/tests/run_pg16.py --incident-pg16-port 55439 --incident-timezone "$zone" backend/tests/test_datetime_incident.py backend/tests/test_datetime_pg16.py backend/tests/test_pack_credits.py::PostgreSQLPackCreditContractTests -q --tb=short 2>&1 | tee -a backend-pg16-results.txt
          done
      - name: Save backend test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ matrix.dependencies }}-${{ github.run_id }}
          path: |
            backend-test-results.txt
            backend-pg16-results.txt
          retention-days: 30

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend workflow tests
        run: pnpm test
      - name: Install pinned Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run two offline save interface tests
        run: pnpm test:ui
      - name: Build production frontend
        run: pnpm build 2>&1 | tee frontend-build-results.txt
      - name: Save frontend build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-results-${{ github.run_id }}
          path: frontend/frontend-build-results.txt
          retention-days: 30
