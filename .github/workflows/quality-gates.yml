name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///./ci-test.db
      DEPLOYMENT_MODE: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run full backend and fixed-fixture suite
        run: python -m unittest discover -s backend/tests -v 2>&1 | tee backend-test-results.txt
      - name: Save backend test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ github.run_id }}
          path: backend-test-results.txt
          retention-days: 30

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend workflow tests
        run: pnpm test
      - name: Build production frontend
        run: pnpm build 2>&1 | tee frontend-build-results.txt
      - name: Save frontend build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-results-${{ github.run_id }}
          path: frontend/frontend-build-results.txt
          retention-days: 30
