name: Quality gates

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payment_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      PACK_CREDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payment_test?sslmode=disable
      DEPLOYMENT_MODE: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Reproduce Supabase default grants
        run: psql "$PACK_CREDIT_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/tests/sql/bootstrap_supabase_test.sql
      - name: Supabase migration dry-run
        run: supabase db push --db-url "$PACK_CREDIT_TEST_DATABASE_URL" --dry-run --include-all
      - name: Run PostgreSQL 16 payment contracts
        run: python -m unittest backend.tests.test_credit_lots backend.tests.test_payment_orders backend.tests.test_pack_credits -v

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///./ci-test.db
      DEPLOYMENT_MODE: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run full backend and fixed-fixture suite
        run: python -m unittest discover -s backend/tests -v 2>&1 | tee backend-test-results.txt
      - name: Save backend test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ github.run_id }}
          path: backend-test-results.txt
          retention-days: 30

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend workflow tests
        run: pnpm test
      - name: Build production frontend
        run: pnpm build 2>&1 | tee frontend-build-results.txt
      - name: Save frontend build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-results-${{ github.run_id }}
          path: frontend/frontend-build-results.txt
          retention-days: 30
